name: nuget

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'

env:
  SOLUTION: nats-reply.sln
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Beta identifiers for feature branches
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: |
          set -euo pipefail
          SLUG=$(echo "${{ github.ref_name }}" \
            | sed 's|^feature/||' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's|[^0-9a-z]|-|g; s|-\+|-|g; s|^-||; s|-$||' \
            | cut -c1-20 | sed 's|-$||')
          if [ -z "$SLUG" ]; then SLUG=dev; fi
          case "$SLUG" in [0-9]*) SLUG="b-$SLUG";; esac
          echo "MinVerDefaultPreReleaseIdentifiers=beta.$SLUG" >> "$GITHUB_ENV"

      - run: dotnet restore "$SOLUTION"

      - run: dotnet build "$SOLUTION" -c Release --no-restore

      - run: dotnet test "$SOLUTION" -c Release --no-build --verbosity normal

      - run: dotnet pack "$SOLUTION" -c Release --no-build -o artifacts

      - name: Summary
        run: |
          COUNT=$(ls -1 artifacts/*.nupkg | wc -l)
          echo "### Packed $COUNT package(s)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for f in artifacts/*.nupkg; do echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"; done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error

  publish-beta:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write 
      id-token: write   
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: GitHub Release
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.nupkg
          --repo "${{ github.repository }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}